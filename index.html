<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wheather app </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Search your city " spellcheck="false">
            <button>
                <img src="images/search.png" alt=" Search bar icon">
                <!-- i will add some search bar icon -->
            </button>
        </div>
        <div class="error">
            <p>The city you have entered is wrong !! </p>
        </div>
        <div class="wheather">
            <img src="images/clear.png" class="wheather_kasto_xw_icon">
            <h1 class="temp">50°C</h1>
            <h2 class="city">Butwal</h2>
            <div class="further-details">

                <!-- Humidity ko lagi  -->
                <div class="col1">
                    <img src="images/humidity.png" alt="humidity image">
                    <div>
                        <p class="humidity">90%</p>
                        <p>Pani in hawa</p>
                    </div>
                </div>

                <!-- wind ko lagi -->

                <div class="col1">
                    <img src="images/wind.png" alt="wind image">
                    <div>
                        <p class="hawa">100km/hr</p>
                        <p>Wind ko gati </p>
                    </div>
                </div>
            </div>
        </div>
        <div class="logo-box">
            <img src="images/मौसम.svg" alt="logo of the app" class="applogo">
        </div>


        <script src="app.js"></script>
</body>

</html>
